# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.15.3"
  go_ld_flags: -w -s -X main.VERSION=v${{ version }} -extldflags -static
  go_build: go build -v -buildmode=pie -trimpath -modcacherw -ldflags="${{ go_ld_flags }}"

package:
  name: rancher-cli
  version: ${{ version }}

source:
  url: https://github.com/rancher/cli/archive/v${{ version }}.tar.gz
  sha256: c9ea33994de4c4600a403fd6c90545d3481b60fe4e5e96318dbc28c40faa7c68

build:
  number: 0
  script:
    content:
      - if: unix
        then: ${{ go_build }} -o "${PREFIX}/bin/rancher"
        else: ${{ go_build }} -o "%SCRIPTS%\rancher.exe"
      - go-licenses save . --save_path library_licenses
requirements:
  build:
    - ${{ compiler("go") }}
    - ${{ stdlib("c") }}
    - go-licenses

tests:
  - package_contents:
      strict: true
      bin:
        - rancher-cli
  - script:
      - rancher --help
      - rancher --version
      - rancher --version | ${{ "grep -iE " if win else "findstr /r /c:" }}${{ version | replace(".", "\\.") }}

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - library_licenses/
  summary: The Rancher Command Line Interface (CLI) is a unified tool for interacting with your Rancher Server.
  homepage: https://github.com/rancher/cli
  documentation: https://ranchermanager.docs.rancher.com/reference-guides/cli-with-rancher/rancher-cli

extra:
  recipe-maintainers:
    - bollwyvl
